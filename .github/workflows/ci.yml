name: AGI C CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runnable AGI prototype
        run: make
      - name: Test knowledge graph
        run: make test
      - name: Clean generated files
        run: make clean
